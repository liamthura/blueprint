name: Template builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Copy template to a clean directory
        run: cp -R template "${RUNNER_TEMP}/app"
      - name: Install
        working-directory: ${{ runner.temp }}/app
        run: pnpm install --no-frozen-lockfile
      - name: Install browsers
        working-directory: ${{ runner.temp }}/app
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck, lint, test, build
        working-directory: ${{ runner.temp }}/app
        run: pnpm typecheck && pnpm lint && pnpm test:scripts && pnpm test && pnpm build

  build-with-capabilities:
    runs-on: ubuntu-latest
    # Deliberately no env: block. The CLI seeds .env, and `next build` reads it,
    # so the job builds against exactly what a user gets. Supplying values here
    # would have hidden that a fresh `ai` project could not build without an
    # OpenAI key — CI was green while every real user hit the failure.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run the create-cli test suite
        run: node --test bin/*.test.mjs

      # No registry is configured and none is served: this is the default path,
      # where capabilities are materialised from this checkout. registry.yml
      # separately proves every item still resolves when served over HTTP.
      - name: Create an app with every capability
        run: |
          node bin/create.mjs "${RUNNER_TEMP}/app" \
            --capabilities db,auth,ai,tables \
            --no-tests --yes

      - name: The capabilities must have been wired in
        working-directory: ${{ runner.temp }}/app
        shell: bash
        run: |
          for f in src/lib/db/index.ts src/lib/auth.ts src/lib/db/auth-schema.ts \
                   src/app/api/auth/\[...all\]/route.ts src/app/api/chat/route.ts \
                   src/components/data-table.tsx drizzle.config.ts \
                   Dockerfile .dockerignore compose.yaml compose.db.yaml; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          node -e "
            const p = require('./package.json');
            for (const s of ['db:up','db:migrate','db:studio','test:e2e']) {
              if (!p.scripts[s]) { console.error('missing script: ' + s); process.exit(1); }
            }
            if (p.scripts.test) { console.error('--no-tests left the test script behind'); process.exit(1); }
          "
          grep -q '^DATABASE_URL=' .env.example
          grep -q '^BETTER_AUTH_SECRET=' .env.example
          grep -q '^OPENAI_API_KEY=' .env.example
          # The CLI seeds .env, so the project runs without hand-editing a file.
          grep -q '^DATABASE_URL=postgres://' .env
          node -e "
            const m = require('node:fs').readFileSync('.env','utf8').match(/^BETTER_AUTH_SECRET=(.*)$/m);
            if (!m || m[1].length < 32) { console.error('auth secret was not generated'); process.exit(1); }
          "

      - name: Typecheck, lint and build the generated app
        working-directory: ${{ runner.temp }}/app
        run: pnpm typecheck && pnpm lint && pnpm build

      - name: Adding a capability twice must not break the project
        working-directory: ${{ runner.temp }}/app
        run: pnpm blueprint add db --source "${GITHUB_WORKSPACE}/site" && pnpm typecheck
